[project]
name = "stage-ui"
version = "0.1.0"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=4.13.0.90",
    "pandas>=3.0.0",
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
    "pyserial>=3.5",
    "stage_ui_lib",
]

[tool.uv.sources]
stage-ui-lib = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/stage-ui-lib",
]
