[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pdoc>=16.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.49",
    "types-pyserial>=3.5.0.20251001",
]

[tool]

[tool.uv]

[tool.uv.workspace]
members = [
    "packages/axon-ui",
    "packages/worm-shooter",
]

[tool.ty]
rules = { all = "error" }

[tool.ty.environment]
python-version = "3.14"

[tool.mypy]
python_version = "3.14"
mypy_path = "packages/worm-shooter/src:packages/axon-ui/src"
strict = true

[tool.ruff]
target-version = "py314"
src = ["packages/worm-shooter/src", "packages/axon-ui/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "N", "SIM"]
ignore = ["E501", "B024", "B027", "RUF022", "N802", "N806", "SIM102"]
