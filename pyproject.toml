[project]
name = "stage-ui"
version = "2.0.dev0"
requires-python = ">=3.14"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
dependencies = [
    "opencv-python>=4.13.0.90",
    "pandas>=3.0.0",
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
    "pyserial>=3.5",
]

[project.scripts]
stage-ui = "stage_ui.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "ruff>=0.14.14",
    "types-pyserial>=3.5.0.20251001",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stage_ui"]
