[project]
name = "axon-ui-kit"
description = "Widgets for use with axon-ui"
version = "0.1.0"
requires-python = ">=3.14"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
dependencies = [
    "axon-ui"
]

[project.scripts]
axonkit = "axonkit.__main__:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool]

[tool.uv]

[tool.uv.build-backend]
module-name = "axonkit"

[tool.uv.sources]
axon-ui = { workspace = true }
