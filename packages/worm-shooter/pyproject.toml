[project]
name = "worm-shooter"
description = "Desktop app for controlling lab microscope stage and laser."
version = "2.0rc1"
requires-python = ">=3.14"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
dependencies = [
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
    "pyserial>=3.5",
]

[project.scripts]
shooter = "shooter.__main__:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shooter"
