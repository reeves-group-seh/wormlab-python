[project]
name = "worm-shooter"
description = "Desktop app for controlling lab microscope stage and laser"
version = "2.0rc4"
requires-python = ">=3.14"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
dependencies = [
    "axon-ui",
    "axon-ui-kit",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "pyserial>=3.5",
]

[project.scripts]
shooter = "shooter.__main__:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool]

[tool.uv]

[tool.uv.build-backend]
module-name = "shooter"

[tool.uv.sources]
axon-ui = { workspace = true }
axon-ui-kit = { workspace = true }
