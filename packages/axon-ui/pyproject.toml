[project]
name = "axon-ui"
description = "Reactive pygame + pygame_gui library"
version = "0.1.0"
requires-python = ">=3.14"
readme = "readme.md"
authors = [
    { name = "Mack Rusing", email = "mail@mackk.net" }
]
dependencies = [
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool]

[tool.uv]

[tool.uv.build-backend]
module-name = "axon"
